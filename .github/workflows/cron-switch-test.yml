name: Cron Switch Test
# Test-only (no Azure). Cron gates each env by its own CRON_ENABLED variable
# (in <env>-v2). Manual runs bypass the switch. Action derived from the minute.
on:
  workflow_dispatch:
    inputs:
      dev:    { type: boolean, default: true }
      uat:    { type: boolean, default: true }
      action: { type: choice, options: [scale-down, scale-up], default: scale-up }
  schedule:
    - cron: '50 10 * * *'      # 10:50 UAE (odd time, ~30 min lead; avoid :00/:30)
      timezone: 'Asia/Dubai'
permissions:
  contents: read
jobs:
  master-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: dev-v2
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - id: g
        shell: bash
        env:
          MASTER: ${{ vars.CRON_MASTER_ENABLED }}
        run: |
          echo "enabled=$MASTER" >> "$GITHUB_OUTPUT"
          if [[ "$MASTER" == "true" ]]; then
            echo "🟢 Master gate ENABLED (CRON_MASTER_ENABLED=$MASTER) — scheduled runs will proceed"
            echo "### 🟢 Master gate ENABLED — scheduled runs will proceed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🔴 Master gate DISABLED (CRON_MASTER_ENABLED=$MASTER) — all scheduled runs skipped"
            echo "### 🔴 Master gate DISABLED — all scheduled runs skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
  decide:
    needs: master-gate
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    env:
      ENVIRONMENTS: 'dev uat'
      INPUT_DEV: ${{ inputs.dev }}
      INPUT_UAT: ${{ inputs.uat }}
    steps:
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ needs.master-gate.outputs.enabled }}" != "true" ]]; then
              echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; exit 0   # master OFF -> skip all
            fi
            MIN=$(date -u +%M)                                   # 10# avoids octal on 08/09
            (( (10#$MIN / 5) % 2 == 0 )) && ACTION="scale-up" || ACTION="scale-down"
          else
            ACTION="${{ inputs.action }}"
          fi
          inc=""
          for e in $ENVIRONMENTS; do
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              key="INPUT_$(echo "$e" | tr '[:lower:]' '[:upper:]')"
              [[ "${!key:-false}" == "true" ]] || continue       # manual: only ticked envs
            fi
            inc="${inc:+$inc,}{\"name\":\"$e\",\"action\":\"$ACTION\"}"
          done
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
  run:
    needs: decide
    if: needs.decide.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.decide.outputs.matrix) }}
    environment: ${{ matrix.name }}-v2
    steps:
      - shell: bash
        env:
          EVT: ${{ github.event_name }}
          ENV_NAME: ${{ matrix.name }}
          ACTION: ${{ matrix.action }}
          CRON_ENABLED: ${{ vars.CRON_ENABLED }}
        run: |
          if [[ "$EVT" == "schedule" && "$CRON_ENABLED" != "true" ]]; then
            echo "### $ENV_NAME — ⏭️ GATED (cron disabled, CRON_ENABLED=$CRON_ENABLED)" >> "$GITHUB_STEP_SUMMARY"
            echo "GATED: $ENV_NAME"; exit 0
          fi
          echo "### $ENV_NAME — ✅ WOULD $ACTION (event=$EVT)" >> "$GITHUB_STEP_SUMMARY"
          echo "[SIMULATION] $ACTION for $ENV_NAME — no Azure calls."
 
